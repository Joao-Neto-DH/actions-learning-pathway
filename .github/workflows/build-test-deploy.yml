name: build-test-deploy
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
      - run: echo "$(cat hello_world.txt)"
      - name: setup-nodejs
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      - run: npm install 
      - run: npm run build
  test: 
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      - name: Use nodejs
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      - run: npm install
      - run: npm test
  deploy:
    # should run on test successifull
    # needs: test
    permissions:
      contents: write
      pages: write
      id-token: write
      
    environment:
      name: production
      url: ${{ steps.deployments.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup nodejs
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          
      - name: Configure github pages
        uses: actions/configure-pages@v3
        with: 
          static_site_generator: next
      - run: npm install
      - run: npm run build
      
      - name: upload artifacts
        uses: actions/upload-pages-artifact@v1
        with:
          path: './out'
          
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v1
        
