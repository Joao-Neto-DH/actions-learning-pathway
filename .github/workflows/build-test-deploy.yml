name: build-test-deploy
on: push
jobs:
  hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
      - run: echo "$(cat hello_world.txt)"
      - name: setup-nodejs
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      - name: Installing dependecies
      - run: npm install 
      - name: Building project
      - run: npm run build
        
